<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>кто я</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            color: #cc3333;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        /* Фон с мясом и гнилью (градиент + текстура) */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 30% 40%, #4a0000 0%, #1a0000 70%),
                repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(100,0,0,0.1) 10px, rgba(100,0,0,0.1) 20px);
            z-index: 0;
        }
        /* Кровавые разводы */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M10 50 Q30 20 50 40 Q70 60 90 30 Q80 80 50 70 Q20 60 10 90" fill="rgba(120,0,0,0.15)"/><path d="M80 10 Q70 40 90 60 Q60 80 40 70 Q20 50 10 80" fill="rgba(150,0,0,0.1)"/></svg>') repeat;
            background-size: 200px 200px;
            z-index: 0;
            opacity: 0.5;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 700px;
            padding: 40px;
            border: 3px solid #660000;
            background: rgba(0,0,0,0.8);
            box-shadow: 0 0 60px rgba(200,0,0,0.3), inset 0 0 60px rgba(100,0,0,0.2);
        }
        h1 {
            font-size: 3rem;
            color: #cc2222;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #660000;
            letter-spacing: 5px;
            border-bottom: 2px solid #660000;
            padding-bottom: 20px;
        }
        .meat-text {
            margin: 30px 0;
            font-size: 1.2rem;
            color: #aa5555;
            line-height: 1.8;
            text-shadow: 0 0 10px rgba(200,0,0,0.3);
            font-family: 'Times New Roman', serif;
        }
        .meat-text span {
            color: #cc2222;
            font-weight: bold;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; text-shadow: 0 0 10px #ff0000; }
            50% { opacity: 1; text-shadow: 0 0 30px #ff0000, 0 0 60px #660000; }
            100% { opacity: 0.6; text-shadow: 0 0 10px #ff0000; }
        }
        .blood-drip {
            display: inline-block;
            animation: drip 3s infinite;
        }
        @keyframes drip {
            0% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(5px); opacity: 1; }
            100% { transform: translateY(0); opacity: 0.5; }
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #883333;
            text-decoration: none;
            border: 2px solid #440000;
            padding: 10px 30px;
            transition: 0.3s;
            background: rgba(0,0,0,0.5);
        }
        .back-link:hover {
            background: #220000;
            border-color: #cc2222;
            color: #cc4444;
            box-shadow: 0 0 30px rgba(200,0,0,0.3);
        }
        .gore-decoration {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 10px;
            background: linear-gradient(to right, #2a0000, #660000, #2a0000);
            z-index: 2;
            box-shadow: 0 -5px 30px rgba(200,0,0,0.3);
        }
        .gore-decoration::before {
            content: '⚰';
            position: absolute;
            right: 20px;
            top: -30px;
            font-size: 30px;
            opacity: 0.3;
        }
        .gore-decoration::after {
            content: '⚰';
            position: absolute;
            left: 20px;
            top: -30px;
            font-size: 30px;
            opacity: 0.3;
        }
        .rotten-text {
            font-size: 0.9rem;
            color: #442222;
            margin-top: 20px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>КТО Я</h1>
        <div class="meat-text">
            <span>Я</span> — то, что осталось от человека.<br>
            Моя плоть <span class="blood-drip">гниёт</span> в стальной печи.<br>
            Моя душа — <span>ржавчина</span> на трубах.<br>
            <span style="font-size:0.8rem; color:#662222;">...и я не знаю, кто я...</span>
        </div>
        <div class="meat-text" style="font-size:0.9rem; border-top: 1px solid #330000; padding-top: 20px;">
            <span>здесь</span> будет <span>твой текст</span><br>
            о том, <span>кто ты</span> на самом деле
        </div>
        <a href="index.html" class="back-link">вернуться</a>
        <div class="rotten-text">✦ ты уже мёртв ✦</div>
    </div>
    <div class="gore-decoration"></div>
</body>
</html>
